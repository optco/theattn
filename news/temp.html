<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- STORY ID: filename = YYMMDDHHMM.html (South Africa time). Use the SAME id in the places marked [ID] below. -->
<title>Headline goes here | TheAttn</title>
<meta name="description" content="One or two sentences shown on the card and under the headline.">
<meta property="og:title" content="Headline goes here">
<meta property="og:description" content="One or two sentences shown on the card and under the headline.">
<!-- IMAGE: paste the real image URL here AND in the <img src> below. Use a full URL, e.g. https://theattn.com/news/img/YYMMDDHHMM.jpg for your own uploads. -->
<meta property="og:image" content="https://example.com/image.jpg">
<!-- topic: Science, Technology or Space. Several allowed, comma separated: Science, Technology. Breaking stories also set breaking to true below. -->
<meta name="topic" content="World">
<meta name="breaking" content="false">
<!-- [ID] -->
<link rel="canonical" href="https://theattn.com/news/YYMMDDHHMM.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <article class="story">
    <p class="tag">World</p>
    <h1>Headline goes here</h1>
    <p class="dek">One or two sentences shown on the card and under the headline.</p>
    <!-- [ID] datetime format: YYYY-MM-DDTHH:MM -->
    <p class="byline"><time datetime="2026-01-01T00:00">1 January 2026, 00:00</time> &middot; Source: Name of source</p>

    <!-- Same image URL as og:image above. Delete this whole figure if the story has no image (also leave og:image empty). -->
    <figure>
      <img src="https://example.com/image.jpg" alt="Describe the photo." onerror="this.closest('figure').hidden=true">
      <figcaption>Photo caption. (Photo credit: Web)</figcaption>
    </figure>

    <!-- OPTIONAL: X (Twitter) embed. Delete the figure above if you use this instead.
    <div class="x-embed">
      PASTE X EMBED CODE HERE
    </div>
    -->

    <div class="story-body">
      <p>First paragraph.</p>
      <p>Second paragraph.</p>
    </div>
  </article>
</main>
<div id="site-footer"></div>
</body>
</html>
