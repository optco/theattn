<meta name="topic" content="World">
<meta name="breaking" content="false">
<!-- [ID] -->

<div id="site-header"></div>
<main class="wrap">

    <p class="tag">topic</p>

    <p class="dek">One or two sentences shown on the card and under the headline.</p>
    <!-- [ID] datetime format: YYYY-MM-DDTHH:MM -->
    <p class="byline"><time datetime="2026-01-01T00:00">date and time here</time> &middot; Source: Name of source if any</p>

    <!-- Same image URL as og:image above. Don't remove it even if no image, instead bring <figure> code inside this comment -->
       <figure>
  <img data-og alt="Describe the photo." onerror="this.closest('figure').hidden=true">

</figure>
